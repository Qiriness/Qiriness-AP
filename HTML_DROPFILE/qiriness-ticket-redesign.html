<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qiriness · Service client — Prototype de redesign</title>
  <style>
    :root{
      --bg:#f7f8fa;--white:#fff;--ink:#172433;--ink-soft:#3f4b59;--muted:#778391;--muted-2:#97a2ae;
      --line:#e7ebef;--line-strong:#dbe2e8;--teal:#167a78;--teal-dark:#0b6563;--teal-soft:#eaf6f3;
      --blue:#4e7fca;--violet:#7567bd;--orange:#d2914e;--red:#d75f60;--amber-bg:#fff8ee;
      --shadow:0 5px 18px rgba(24,37,54,.05);--radius:12px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.48}
    input,select,textarea{outline:none}
    .ico{flex:none;vertical-align:middle;stroke-width:1.8}
    .app{display:flex;height:100dvh;min-height:680px;width:100%;overflow:hidden}
    .rail{width:62px;flex:0 0 62px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;padding:17px 0 16px;gap:12px;z-index:3}
    .brand-q{font-family:Georgia,serif;font-size:32px;line-height:35px;letter-spacing:-5px;font-weight:400;transform:translateX(-2px);color:#111c20;padding-bottom:18px}
    .rail-link{border:0;background:transparent;color:#84909c;width:38px;height:39px;display:grid;place-items:center;border-radius:10px;position:relative}
    .rail-link:hover{background:#f2f5f6;color:#2d4852}
    .rail-link.active{background:#e9f5f3;color:var(--teal)}
    .rail-link.active:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;background:var(--teal);width:3px;border-radius:0 3px 3px 0}
    .rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:11px}
    .work-shell{display:flex;flex-direction:column;flex:1;min-width:0}
    .topbar{height:62px;min-height:62px;border-bottom:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 25px}
    .topbar-left,.topbar-right{display:flex;align-items:center;gap:13px}
    .crumb{color:var(--muted);font-size:12px}
    .crumb-sep{color:#c4cbd2}
    .crumb-active{font-size:13px;font-weight:700}
    .topbar-right{gap:19px}
    .sync-state{display:flex;align-items:center;gap:7px;color:#6c7782;font-size:11px}
    .green-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#27a979;box-shadow:0 0 0 3px #eaf7f0}
    .icon-button{border:1px solid transparent;border-radius:9px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#6b7784;background:transparent;flex:none}
    .icon-button:hover{color:var(--ink);background:#f2f5f7;border-color:#e9eef1}
    .icon-button.border{border-color:var(--line-strong);background:white}
    .profile{height:31px;width:31px;border:1px solid #dbebec;color:#176e71;background:#eaf5f4;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800}
    .demo-label{font-size:10px;color:#9a7284;background:#fbf2f5;border:1px solid #f3e7eb;border-radius:20px;padding:5px 10px;letter-spacing:.3px;font-weight:700}
    .content-grid{display:flex;flex:1;min-height:0;min-width:0}
    /* inbox pane */
    .queue{width:340px;flex:0 0 340px;min-width:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:flex-basis .2s ease,width .2s ease;overflow:hidden}
    .queue-header{padding:22px 18px 11px;flex:none}
    .queue-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:8px}
    .queue-heading h2{font-size:17px;margin:0;letter-spacing:-.45px;font-weight:760}
    .queue-heading .muted-count{color:#9aa5ac;font-size:11px;font-weight:600;margin-left:5px}
    .subtle-btn{background:white;border:1px solid #e1e7eb;padding:6px 8px;border-radius:8px;display:flex;align-items:center;color:#6f7d86;gap:4px}
    .subtle-btn:hover{background:#f3f6f7}
    .segmented{height:37px;border-radius:9px;background:#f2f4f6;padding:3px;display:flex;gap:2px;margin-bottom:15px}
    .segmented button{flex:1;border:0;background:transparent;color:#6e7b88;border-radius:7px;font-size:12px;font-weight:650;white-space:nowrap}
    .segmented button.active{color:#1a3840;background:white;box-shadow:0 1px 4px rgba(21,38,54,.09)}
    .segment-number{font-weight:700;color:inherit;opacity:.65;margin-left:4px}
    .search{height:39px;border:1px solid var(--line-strong);border-radius:9px;display:flex;gap:9px;align-items:center;padding:0 11px;color:#919daa;margin-bottom:10px}
    .search:focus-within{border-color:#9abdbd;box-shadow:0 0 0 3px #edf6f5}
    .search input{border:0;min-width:0;flex:1;color:var(--ink);background:transparent;font-size:12px}
    .search input::placeholder{color:#9aa6b0}
    .queue-filter-row{display:flex;align-items:center;gap:8px}
    .filter-select{flex:1;min-width:0;appearance:none;background:#fff;border:1px solid var(--line-strong);border-radius:8px;height:34px;padding:0 30px 0 10px;font-size:11.5px;color:#51606b;cursor:pointer}
    .select-wrap{position:relative;flex:1;min-width:0}
    .select-wrap:after{content:"";pointer-events:none;position:absolute;right:11px;top:12px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #7f8b95}
    .counter-line{display:flex;align-items:center;justify-content:space-between;color:#99a4ae;font-size:11px;margin:13px 2px 1px}
    .counter-line strong{color:#677884;font-weight:650}
    .queue-list{overflow:auto;flex:1;overscroll-behavior:contain;padding:0 8px 12px}
    .queue-list::-webkit-scrollbar,.thread-scroll::-webkit-scrollbar,.inspector-scroll::-webkit-scrollbar{width:6px}
    .queue-list::-webkit-scrollbar-thumb,.thread-scroll::-webkit-scrollbar-thumb,.inspector-scroll::-webkit-scrollbar-thumb{background:#dfe5ea;border-radius:6px}
    .ticket-row{display:block;text-align:left;position:relative;width:100%;border:1px solid transparent;border-radius:10px;background:white;margin:2px 0 3px;padding:13px 12px 12px 15px;color:inherit;min-height:110px}
    .ticket-row:hover{background:#f7f9fa}
    .ticket-row.active{background:#edf7f5;border-color:#d8eae5}
    .ticket-row:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:2px;background:var(--cat-color)}
    .ticket-row.active:before{width:4px}
    .ticket-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
    .ticket-person{font-size:12px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ticket-ago{font-size:10.5px;color:#94a0a9;white-space:nowrap}
    .ticket-subject{font-weight:690;letter-spacing:-.15px;color:#263746;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;margin-bottom:6px}
    .ticket-preview{color:#84919c;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
    .ticket-bottom{display:flex;align-items:center;justify-content:space-between;gap:5px}
    .ticket-cat{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#7c8994;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-dot{height:7px;width:7px;background:var(--cat-color);border-radius:50%;flex:none}
    .ticket-flags{display:flex;align-items:center;gap:6px;flex:none}
    .urgent-pip{height:7px;width:7px;background:var(--red);border-radius:50%}
    .pill-owner{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;height:21px;width:21px;background:#eef0f3;color:#637380;font-size:9px;font-weight:760;border:1px solid #e5e9ed}
    .pill-owner.unassigned{background:#fff;color:#acb3b9;border-style:dashed}
    .mini-queue{display:none;flex-direction:column;gap:10px;align-items:center;padding-top:15px;overflow:auto}
    .mini-heading{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:8px}
    .mini-ticket{position:relative;border:1px solid #e9edf1;width:42px;height:42px;border-radius:11px;background:white;display:grid;place-items:center;color:#485a67;font-size:12px;font-weight:800}
    .mini-ticket:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--cat-color)}
    .mini-ticket.active{border-color:#c9e4de;background:var(--teal-soft);color:var(--teal)}
    .mini-ticket:hover{border-color:#a5c7c2}
    .app.queue-compact .queue{width:68px;flex-basis:68px}
    .app.queue-compact .queue-header,.app.queue-compact .queue-list{display:none}
    .app.queue-compact .mini-queue{display:flex}
    .app.queue-hidden .queue{width:0;flex-basis:0;border-right:0}
    .empty-state{padding:30px 15px;text-align:center;color:#94a0a9;font-size:12px;line-height:1.6}
    /* case area */
    .case{flex:1;min-width:0;display:flex;flex-direction:column;background:#fbfcfd}
    .case-header{padding:21px 28px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none}
    .case-kicker{display:flex;align-items:center;gap:7px;color:#7d8994;font-size:10.5px;letter-spacing:.6px;font-weight:730;text-transform:uppercase;margin-bottom:9px}
    .case-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .case-title-group{flex:1;min-width:0}
    .case-title{font-size:21px;font-weight:770;letter-spacing:-.7px;line-height:1.28;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .case-subtitle{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:#778490}
    .case-actions{display:flex;align-items:center;gap:7px;flex:none;margin-top:0}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:35px;border-radius:8px;padding:0 12px;font-size:11.5px;font-weight:700;border:1px solid var(--line-strong);background:#fff;color:#455562;white-space:nowrap}
    .button:hover{background:#f7fafb;border-color:#cbd7de}
    .button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
    .button.primary:hover{background:var(--teal-dark)}
    .button.textual{border-color:transparent;background:transparent;color:#647482}
    .button.textual:hover{background:#f4f7f8}
    .button.tiny{height:27px;padding:0 9px;font-size:10.5px}
    .button.danger{color:#b85656}
    .case-inline-meta{display:flex;align-items:center;gap:7px;margin-top:13px;flex-wrap:wrap}
    .meta-chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #e6eaf0;background:#f8fafb;color:#697784;border-radius:6px;font-size:10.5px;padding:5px 8px;font-weight:600}
    .meta-chip.cat{color:var(--cat-color);background:var(--cat-bg);border-color:transparent}
    .meta-chip.urgent{color:#b95759;background:#fff0f0;border-color:#f9e1e0}
    .meta-chip .ico{width:12px;height:12px}
    .case-topline{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
    .case-topline-left{display:flex;align-items:center;gap:10px}
    .case-topline-right{display:flex;align-items:center;gap:6px}
    .case-expand-btn{color:#687d8a}
    .context-strip{display:flex;align-items:center;gap:14px;padding:11px 28px;background:#fbfcfd;border-bottom:1px solid var(--line);color:#667582;flex:none;min-height:49px;font-size:11px}
    .context-strip .context-piece{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
    .context-strip .context-piece strong{color:#425360;font-weight:720}
    .context-strip .context-sep{height:16px;width:1px;background:#e0e6eb}
    .context-strip .context-spacer{margin-left:auto}
    .context-strip .context-link{border:0;background:none;color:var(--teal);font-size:11px;font-weight:750;white-space:nowrap;padding:0}
    .context-tabs{display:flex;gap:25px;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);height:48px;min-height:48px;background:white;flex:none}
    .tab{height:100%;position:relative;display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:#8996a0;font-size:12px;font-weight:660;padding:0}
    .tab.active{color:var(--ink)}
    .tab.active:after{content:"";position:absolute;height:2px;left:0;right:0;bottom:-1px;background:var(--teal);border-radius:2px}
    .tab-count{padding:2px 6px;border-radius:6px;background:#f0f3f5;font-size:10px;color:#8895a0}
    .tab.active .tab-count{background:#e8f4f1;color:var(--teal)}
    .thread-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:90px;padding:22px 28px 24px}
    .thread-inner{max-width:910px;margin:0 auto}
    .date-divider{display:flex;align-items:center;gap:12px;color:#a0aab3;font-size:10px;margin:6px 0 18px}
    .date-divider:before,.date-divider:after{content:"";height:1px;background:#ecf0f3;flex:1}
    .older-toggle{display:flex;align-items:center;gap:7px;border:1px solid #e3e9ed;background:white;border-radius:8px;color:#677988;padding:8px 12px;font-size:11px;font-weight:680;margin-bottom:16px}
    .older-toggle:hover{border-color:#bfd7d4}
    .message-card{background:#fff;border:1px solid #e6ebef;border-radius:11px;padding:16px 19px;margin-bottom:13px;box-shadow:0 3px 12px rgba(20,45,58,.025)}
    .message-card.latest{border-color:#d9e4e6;box-shadow:0 5px 18px rgba(13,52,59,.045)}
    .message-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
    .message-header-left{display:flex;align-items:center;gap:10px}
    .avatar{width:33px;height:33px;background:#eaf1f5;border:1px solid #e0e9ee;color:#527083;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
    .avatar.agent{color:#276f6d;background:#e9f5f1;border-color:#d8eae5}
    .avatar.note{color:#a17743;background:#fff0d8;border-color:#f2e2c7}
    .message-name{font-size:11.5px;color:#2b3c47;font-weight:760}
    .message-address{color:#98a4ae;font-size:10.5px;margin-top:3px}
    .message-time{color:#9aa6ae;font-size:10.5px;white-space:nowrap}
    .message-body{font-size:12.5px;color:#41525e;line-height:1.7;white-space:pre-line}
    .message-body p{margin:0 0 10px}
    .message-body p:last-child{margin-bottom:0}
    .message-footer{display:flex;align-items:center;gap:8px;margin-top:16px}
    .small-outline{display:inline-flex;align-items:center;gap:6px;color:#758793;background:#f8fafb;border-radius:6px;padding:5px 8px;font-size:10px;border:1px solid #edf0f2}
    .note-card{background:#fffaf2;border:1px solid #f0dfbf;box-shadow:none}
    .note-card .message-body{color:#6d5c48}
    .note-internal{color:#aa7d39;font-size:10px;font-weight:720;display:inline-flex;gap:5px;align-items:center;margin-bottom:9px}
    .insight{display:flex;align-items:flex-start;gap:10px;border-radius:9px;padding:12px 14px;background:#fff9f1;border:1px solid #f3e5cf;font-size:11.5px;color:#8b6b40;margin-bottom:14px;line-height:1.5}
    .insight strong{color:#76552f}
    .insight .ico{color:#b77e36;margin-top:1px}
    .insight-action{margin-left:auto;white-space:nowrap;background:transparent;border:0;color:#98703c;font-size:10.5px;font-weight:700;padding-top:2px}
    .activity-event{display:flex;gap:13px;align-items:flex-start;margin:0 0 22px;position:relative}
    .activity-event .event-icon{height:29px;width:29px;border:1px solid #e1e9ed;border-radius:50%;display:grid;place-items:center;color:#8a99a4;background:white;flex:none}
    .event-body{padding-top:2px;font-size:12px;color:#465864;line-height:1.55}
    .event-body strong{font-weight:730}
    .event-time{font-size:10px;color:#a0abb4;margin-top:4px}
    .notes-empty{background:#fff;border:1px dashed var(--line-strong);padding:26px;text-align:center;border-radius:12px;color:#87939c}
    /* composer */
    .composer{background:#fff;border-top:1px solid var(--line-strong);padding:13px 28px 15px;flex:none;box-shadow:0 -7px 18px rgba(21,37,48,.022)}
    .composer-inner{max-width:910px;margin:0 auto}
    .composer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
    .mode-switch{display:flex;align-items:center;gap:4px;padding:3px;background:#f3f5f6;border-radius:8px}
    .mode-switch button{border:0;border-radius:6px;background:transparent;color:#7d8993;height:27px;padding:0 10px;display:flex;align-items:center;gap:7px;font-weight:660;font-size:11px}
    .mode-switch button.active{color:#275b5b;background:white;box-shadow:0 1px 3px #dfe7e8}
    .mode-switch button.note-active{color:#956426;background:#ffefda;box-shadow:none}
    .composer-hint{font-size:10.5px;color:#95a0a9;display:flex;align-items:center;gap:7px}
    .ai-strip{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:#71818b;font-size:10.5px}
    .ai-mark{background:#e9f7f3;border-radius:5px;padding:4px 6px;color:var(--teal);font-size:9px;font-weight:800;letter-spacing:.45px}
    .ai-strip strong{color:#496a70}
    .ai-strip .ai-action{margin-left:auto;border:0;background:none;color:var(--teal);font-size:10.5px;font-weight:760}
    .editor-wrap{border:1px solid #dfe7ea;border-radius:10px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
    .editor-wrap:focus-within{border-color:#94bcb7;box-shadow:0 0 0 3px #edf7f5}
    .editor-wrap.note-mode{background:#fffcf7;border-color:#e9d9be}
    .editor-wrap.note-mode:focus-within{border-color:#d5ac74;box-shadow:0 0 0 3px #fcf4e8}
    .editor-to{padding:11px 13px 0;display:flex;align-items:center;gap:7px;color:#8e9aa3;font-size:10.5px}
    .editor-to strong{color:#667683;font-weight:650}
    .editor-language{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#758690}
    .editor{width:100%;height:94px;resize:vertical;display:block;border:0;outline:none;padding:12px 13px;color:#3b4e5b;background:transparent;line-height:1.6;font-size:12px;min-height:65px;max-height:250px}
    .note-mode .editor{height:99px}
    .editor::placeholder{color:#acb5bd}
    .composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
    .composer-bottom-left{display:flex;align-items:center;gap:11px;color:#a0aab2;font-size:10.5px}
    .composer-bottom-right{display:flex;align-items:center;gap:8px}
    .language-warning{display:flex;align-items:center;gap:6px;color:#b65d5c;font-size:11px;font-weight:650;margin:7px 2px 0}
    /* details inspector */
    .inspector{width:300px;flex:0 0 300px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:flex-basis .2s ease,width .2s ease}
    .app.context-hidden .inspector{width:0;flex-basis:0;border-left:0}
    .inspector-header{display:flex;align-items:center;justify-content:space-between;height:61px;min-height:61px;border-bottom:1px solid var(--line);padding:0 18px 0 20px}
    .inspector-header h2{font-size:14px;font-weight:760;letter-spacing:-.2px;margin:0}
    .inspector-scroll{overflow-y:auto;flex:1}
    .inspector-section{padding:20px 19px;border-bottom:1px solid #eef1f3}
    .section-caption{font-size:10px;letter-spacing:.85px;font-weight:780;color:#a0aab2;text-transform:uppercase;margin:0 0 14px}
    .client-identity{display:flex;gap:10px;align-items:center;margin-bottom:15px}
    .client-name{font-size:12px;font-weight:750;color:#2b3a45;margin-bottom:4px}
    .client-email{font-size:11px;color:#83929d;overflow-wrap:anywhere}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .info-label{font-size:10px;color:#9aa6ae;margin-bottom:5px}
    .info-value{font-size:11px;color:#485966;font-weight:680}
    .order-card{border:1px solid #e6ebef;border-radius:10px;padding:13px 12px;background:#fcfdfd}
    .order-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .order-id{font-weight:780;color:#2a575c;font-size:12.5px}
    .order-state{font-size:9.5px;border-radius:5px;padding:4px 6px;color:#5d7687;background:#eaf1f7;font-weight:680}
    .order-state.warning{background:#fff0e2;color:#b27d3e}
    .order-detail{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;margin:9px 0}
    .order-detail span:first-child{color:#9ba6af}
    .order-detail strong{font-weight:690;color:#465964;text-align:right}
    .text-link{background:none;border:0;color:var(--teal);font-size:11px;font-weight:720;padding:0;display:flex;align-items:center;gap:5px}
    .text-link:hover{text-decoration:underline}

const $=sel=>document.querySelector(sel);
const selected=()=>tickets.find(t=>t.id===state.selected)||tickets[0];
function visibleTickets(){let list=tickets.filter(t=>state.view==='all'||(state.view==='mine'?t.status==='open'&&t.assigned==='Oscar':t.status==='open'));
 if(state.unassigned)list=list.filter(t=>!t.assigned);
 if(state.category!=='all')list=list.filter(t=>t.category===state.category);
 const q=state.query.trim().toLowerCase();if(q)list=list.filter(t=>[t.id,t.customer,t.email,t.subject,t.category,cats[t.category].label,...t.tags].join(' ').toLowerCase().includes(q));
 return list.sort((a,b)=>((a.priority==='high'?0:1)-(b.priority==='high'?0:1))||(a.mins-b.mins));}
function categoryStyle(t){return `--cat-color:${cats[t.category].color};--cat-bg:${cats[t.category].bg}`;}

 const countOpen=tickets.filter(t=>t.status==='open').length;$('#inboxCount').textContent=`${countOpen}`;$('#inboxNum').textContent=countOpen;$('#filteredCount').textContent=`${list.length} ticket${list.length!==1?'s':''}`;
 ['Inbox','Mine','All'].forEach(x=>{$('#view'+x).classList.toggle('active',state.view===x.toLowerCase());});
 $('#unassignedButton').style.background=state.unassigned?'#e9f6f3':'white';$('#unassignedButton').style.color=state.unassigned?'#167a78':'#6f7d86';

function messageHtml(m,t){const note=m.type==='note',out=m.type==='out';return `<article class="message-card ${note?'note-card':''}"><div class="message-header"><div class="message-header-left"><div class="avatar ${note?'note':out?'agent':''}">${note?ico('lock',15):out?'QI':esc(initials(m.author))}</div><div><div class="message-name">${esc(m.author)}</div><div class="message-address">${note?'Note interne · équipe uniquement':out?'Qiriness · message envoyé':esc(t.email)+' · message reçu'}</div></div></div><span class="message-time">${esc(m.date)}</span></div>${note?`<div class="note-internal">${ico('lock',12)} PRIVÉ — JAMAIS ENVOYÉ AU CLIENT</div>`:''}<div class="message-body">${esc(m.body)}</div>${out?`<div class="message-footer"><span class="small-outline">${ico('check',11)} Envoyé depuis Outlook</span></div>`:''}</article>`;}
function renderThread(reset=true){const t=selected();let html='';
 if(state.panel==='conversation'){
 const lastIncoming=t.messages.map((m,i)=>m.type==='in'?i:-1).filter(i=>i>=0).at(-1);
 const split=lastIncoming===undefined?t.messages.length-1:lastIncoming;
 const old=t.messages.slice(0,split),recent=t.messages.slice(split);
 if(old.length)html+=`<button class="older-toggle" data-action="toggleOlder">${ico(state.showOlder?'chevron-down':'chevron-right',14)} ${state.showOlder?'Masquer':'Afficher'} les ${old.length} messages précédents</button>`;
 if(state.showOlder)html+=old.map(m=>messageHtml(m,t)).join('');
 if(recent.length)html+=`<div class="date-divider">Dernier échange</div>`+recent.map((m,i)=>messageHtml(m,t).replace('class="message-card','class="message-card latest')).join('');
 if(t.flag)html+=`<div class="insight">${ico('alert-triangle',16)} <span><strong>Point à vérifier avant de répondre.</strong> ${esc(t.flag)}</span><button class="insight-action" data-action="showInsight">Pourquoi ?</button></div>`;
 }else if(state.panel==='notes'){
 const notes=t.messages.filter(m=>m.type==='note');html=notes.length?notes.map(m=>messageHtml(m,t)).join(''):`<div class="notes-empty">${ico('lock',20)}<p>Aucune note interne sur ce ticket.</p><button class="button tiny" data-action="startNote">${ico('plus',12)} Ajouter une note</button></div>`;
 }else{html=`<div class="date-divider">Historique du dossier</div>`+t.events.map((v,i)=>`<div class="activity-event"><div class="event-icon">${ico(i===0?'mail':i===1?'tag':i===2?'send':'clock',15)}</div><div class="event-body"><strong>${esc(v)}</strong><div class="event-time">${i===t.events.length-1?'Dernière mise à jour':'Évènement précédent'}</div></div></div>`).join('')}
 $('#threadBody').innerHTML=html;
 if(reset)$('#threadScroll').scrollTop=0;
}
function mismatch(t,text){if(t.language!=='EN')return false;const val=text.trim().toLowerCase();return /^(bonjour|bonsoir|cher |chère |nous avons |merci pour votre|bien cordialement)/.test(val)||/\b(nous vous|votre commande|cordialement)\b/.test(val);}

function rerenderTicket(){renderQueue();renderHeader();renderThread();renderComposer();renderInspector();}
function selectTicket(id){if(!tickets.find(t=>t.id===id))return;state.selected=id;state.panel='conversation';state.showOlder=false;state.compose='reply';state.tagEditing=false;$('#app').classList.remove('mobile-inbox');rerenderTicket();}
function saveActiveText(){const el=$('#composerText');if(!el)return;const t=selected();if(state.compose==='note')state.noteDrafts[t.id]=el.value;else state.drafts[t.id]=el.value;}
function addNote(){saveActiveText();const t=selected();const body=(state.noteDrafts[t.id]||'').trim();if(!body){showToast('Saisissez d’abord une note.');return;}t.messages.push(makeMsg('note','Oscar','Aujourd’hui · à l’instant',body));t.events.push('Note interne ajoutée par Oscar');state.noteDrafts[t.id]='';state.panel='conversation';state.showOlder=true;renderHeader();renderThread();renderComposer();showToast('Note ajoutée au dossier (démo locale). Jamais envoyée au client.');}
function addTag(){const el=$('#tagInput');if(!el)return;const val=el.value.trim();if(!val)return;if(!selected().tags.some(x=>x.toLowerCase()===val.toLowerCase()))selected().tags.push(val);state.tagEditing=false;renderInspector();renderQueue();showToast('Tag ajouté au ticket (démo locale).');}
function openModal(type){state.modal=type;let html='';const t=selected();if(type==='resolve')html=`<h3>Résoudre ce ticket ?</h3><p>Le ticket <strong>#${esc(t.id)}</strong> sera retiré de la file « À traiter ». Cette action n’envoie aucun e-mail. Un nouveau message client doit pouvoir le rouvrir automatiquement dans la version réelle.</p><div class="modal-actions"><button class="button" data-action="closeModal">Annuler</button><button class="button primary" data-action="confirmResolve">${ico('check',14)} Confirmer la résolution</button></div>`;
 if(type==='snooze')html=`<h3>Reporter ce ticket</h3><p>Le ticket disparaîtra temporairement de la file de traitement. Dans la version réelle, la date de réveil et les exclusions métier doivent être appliquées côté serveur.</p><div class="modal-actions"><button class="button" data-action="closeModal">Annuler</button><button class="button" data-action="confirmSnooze" data-snooze="demain">Demain</button><button class="button primary" data-action="confirmSnooze" data-snooze="3j">Dans 3 jours</button></div>`;
 if(type==='shortcuts')html=`<h3>Raccourcis clavier</h3><p>Naviguez dans la file sans quitter la conversation.</p><div class="shortcut-grid"><span>Ticket suivant / précédent</span><span><kbd>J</kbd> <kbd>K</kbd></span><span>Rechercher</span><kbd>/</kbd><span>Réduire / afficher la liste</span><kbd>[</kbd><span>Afficher / masquer les détails</span><kbd>]</kbd></div><div class="modal-actions"><button class="button primary" data-action="closeModal">Compris</button></div>`;
 if(type==='linkOrder')html=`<h3>Associer une commande</h3><p>Saisissez un numéro de commande de démonstration. Aucun appel Shopify n’est effectué.</p><input id="linkOrderValue" placeholder="Ex. #Q-74218" style="width:100%;height:42px;padding:0 12px;border:1px solid #d9e2e7;border-radius:8px;margin-bottom:16px"><div class="modal-actions"><button class="button" data-action="closeModal">Annuler</button><button class="button primary" data-action="confirmLinkOrder">Associer</button></div>`;
 $('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="overlayClose"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(type)}">${html}</div></div>`;
}
function closeModal(){state.modal=null;$('#modalRoot').innerHTML='';}
const categorySelect=$('#categoryFilter');categorySelect.innerHTML='<option value="all">Toutes les catégories</option>'+Object.entries(cats).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('');
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value;renderQueue();});
categorySelect.addEventListener('change',e=>{state.category=e.target.value;renderQueue();});
$('#app').addEventListener('input',e=>{if(e.target.id==='composerText') {saveActiveText();const t=selected();$('#languageWarning').innerHTML=state.compose==='reply'&&mismatch(t,e.target.value)?`<div class="language-warning">${ico('alert-circle',13)} Le message semble être en français, mais le client écrit en anglais.</div>`:'';}});
$('#app').addEventListener('change',e=>{
 const t=selected();if(e.target.id==='ownerSelect'){t.assigned=e.target.value||null;t.events.push(t.assigned?'Attribué à '+t.assigned:'Attribution retirée');renderQueue();renderHeader();renderInspector();showToast('Attribution mise à jour (démo locale).');}
 else if(e.target.id==='ticketCatSelect'){t.category=e.target.value;t.events.push('Catégorie corrigée manuellement');renderQueue();renderHeader();renderInspector();showToast('Catégorie mise à jour (démo locale).');}
 else if(e.target.id==='prioritySelect'){t.priority=e.target.value;t.events.push('Priorité modifiée');renderQueue();renderHeader();renderInspector();showToast('Priorité mise à jour (démo locale).');}
});
document.addEventListener('click',e=>{
 const ticketBtn=e.target.closest('[data-ticket]');if(ticketBtn){selectTicket(ticketBtn.dataset.ticket);return;}
 const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;state.unassigned=false;renderQueue();return;}
 const panel=e.target.closest('[data-panel]');if(panel){saveActiveText();state.panel=panel.dataset.panel;renderHeader();renderThread();return;}
 const compose=e.target.closest('[data-compose]');if(compose){saveActiveText();state.compose=compose.dataset.compose;renderComposer();return;}
 const act=e.target.closest('[data-action]');if(!act)return;
 const a=act.dataset.action,t=selected();
 if(a==='overlayClose'){if(e.target.classList.contains('modal-backdrop'))closeModal();return;}
 if(a==='closeModal'){closeModal();return;}
 if(a==='confirmResolve'){t.status='closed';t.events.push('Résolu par Oscar');closeModal();rerenderTicket();showToast('Ticket résolu localement. Aucun e-mail envoyé.');return;}
 if(a==='confirmSnooze'){t.status='snoozed';t.events.push('Reporté par Oscar — '+act.dataset.snooze);closeModal();rerenderTicket();showToast('Ticket reporté dans la démonstration.');return;}
 if(a==='confirmLinkOrder'){const value=$('#linkOrderValue').value.trim();if(!value)return; t.order={id:value,total:'—',state:'À vérifier',carrier:'—',tracking:'—',shipped:'—',items:'—'};closeModal();rerenderTicket();showToast('Commande fictive associée localement.');return;}
 if(a==='focus'){if(!state.focus){state.restoreLayout={queueMode:state.queueMode,contextOpen:state.contextOpen};state.queueMode='hidden';state.contextOpen=false;state.focus=true;}else{state.queueMode=state.restoreLayout?.queueMode||'full';state.contextOpen=state.restoreLayout?.contextOpen??true;state.focus=false;}renderLayout();renderHeader();showToast(state.focus?'Mode concentration activé.':'Disposition normale restaurée.');return;}
 if(a==='compactQueue'){state.queueMode='compact';state.focus=false;renderLayout();renderHeader();return;}
 if(a==='expandQueue'){state.queueMode='full';state.focus=false;renderLayout();renderHeader();return;}
 if(a==='hideQueue'){state.queueMode='hidden';state.focus=false;renderLayout();renderHeader();return;}
 if(a==='toggleContext'){state.contextOpen=!state.contextOpen;state.focus=false;renderLayout();renderHeader();return;}
 if(a==='mobileInbox'){$('#app').classList.add('mobile-inbox');return;}
 if(a==='unassignedToggle'){state.unassigned=!state.unassigned;renderQueue();return;}
 if(a==='toggleOlder'){state.showOlder=!state.showOlder;renderThread(false);return;}
 if(a==='startNote'){state.compose='note';renderComposer();$('#composerText').focus();return;}
 if(a==='showInsight'){showToast('Cette alerte doit provenir de l’investigation du dossier, pas d’une réponse générée sans source.');return;}
 if(a==='useAI'){state.drafts[t.id]=t.ai;state.compose='reply';renderComposer();showToast('Suggestion IA insérée. Relisez les faits et la langue.');return;}
 if(a==='saveDraft'){saveActiveText();showToast('Brouillon sauvegardé dans ce prototype. Aucune écriture Outlook.');return;}
 if(a==='createDraft'){saveActiveText();const content=(state.drafts[t.id]||'').trim();if(!content){showToast('Rédigez une réponse avant de créer le brouillon.');return;}if(mismatch(t,content)){showToast('Langue incohérente avec le message du client : corrigez la réponse.');return;}showToast('Simulation uniquement : aucun brouillon Outlook créé, aucun e-mail envoyé.');return;}
 if(a==='addNote'){addNote();return;}
 if(a==='resolve'){if(t.status==='closed'){t.status='open';t.events.push('Ticket rouvert');rerenderTicket();showToast('Ticket rouvert localement.');}else openModal('resolve');return;}
 if(a==='snooze'){openModal('snooze');return;}
 if(a==='shortcuts'){openModal('shortcuts');return;}
 if(a==='editTags'){state.tagEditing=!state.tagEditing;renderInspector();if(state.tagEditing)$('#tagInput').focus();return;}
 if(a==='confirmTag'){addTag();return;}
 if(a==='removeTag'){t.tags.splice(Number(act.dataset.index),1);renderInspector();renderQueue();showToast('Tag supprimé (démo locale).');return;}
 if(a==='linkOrder'){openModal('linkOrder');return;}
 if(a==='external'){showToast('Prototype : ouverture de Shopify désactivée.');return;}
 if(a==='unused'){showToast('Cette navigation n’est pas incluse dans la maquette des tickets.');return;}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&state.modal){closeModal();return;}
 if(e.key==='Enter'&&e.target.id==='tagInput'){e.preventDefault();addTag();return;}
 if(e.target.matches('input,textarea,select')||e.target.isContentEditable||state.modal)return;
 const key=e.key.toLowerCase();
 if(key==='/'){e.preventDefault();if(state.queueMode!=='full'){state.queueMode='full';renderLayout();renderHeader();}$('#searchInput').focus();return;}
 if(key==='['){state.queueMode=state.queueMode==='full'?'compact':'full';renderLayout();renderHeader();return;}
 if(key===']'){state.contextOpen=!state.contextOpen;renderLayout();renderHeader();return;}
 if(key==='j'||key==='k'){const list=visibleTickets(),i=list.findIndex(t=>t.id===state.selected),offset=key==='j'?1:-1;const next=list[Math.min(list.length-1,Math.max(0,i+offset))];if(next){e.preventDefault();selectTicket(next.id);}}
});
window.addEventListener('resize',()=>{const b=$('#mobileBack');if(b)b.style.display=matchMedia('(max-width:640px)').matches?'inline-flex':'none';});
hydrateIcons();renderAll();
if(matchMedia('(max-width:640px)').matches)$('#app').classList.add('mobile-inbox');
})();
</script>
</body>
</html>
