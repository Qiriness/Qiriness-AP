# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1d6921d59022b38099e9afc9427a903f"
name = "Qiriness Email Agent"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_cart_transforms,read_content,read_customer_data_erasure,read_customers,read_discounts,read_discounts_allocator_functions,read_draft_orders,read_files,read_fulfillments,read_inventory,read_inventory_shipments,read_inventory_shipments_received_items,read_legal_policies,read_locales,read_metaobject_definitions,read_metaobjects,read_online_store_pages,read_order_edits,read_orders,read_price_rules,read_product_listings,read_products,read_returns,read_themes,read_validations"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[webhooks]
api_version = "2026-07"

# ORDERS FIRST, AND ONLY ORDERS FOR NOW. Order freshness is the gap that actually
# reaches the desk: between nightly runs the order table is up to a day behind,
# and on 2026-09-12 it was two days behind with nobody able to tell. Customers and
# products move slowly enough that the nightly is honest about them.
#
# `uri` IS THE DEPLOYED DASHBOARD, over HTTPS. Vercel Deployment Protection must be
# off for production, or Shopify is answered with a login page and every delivery
# fails — the failure looks like a broken handler and is not one.
[[webhooks.subscriptions]]
topics = [
  "orders/create",
  "orders/updated",
  "orders/cancelled",
  "orders/fulfilled",
  "orders/paid",
  "refunds/create"
]
uri = "https://qiriness-ap.vercel.app/api/webhooks/shopify"

# MANDATORY FOR ANY APP THAT TOUCHES CUSTOMER DATA, and the handler for these has
# existed since the compliance work without a URL to be reached at. Same endpoint:
# the route dispatches on the topic header.
[[webhooks.subscriptions]]
topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://qiriness-ap.vercel.app/api/webhooks/shopify"
